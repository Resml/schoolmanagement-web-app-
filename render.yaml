services:
  - type: web
    name: school-management-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString

databases:
  - name: school-db
    plan: free
    databaseName: school_management
    user: postgres
